server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets — served directly regardless of path
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA — serve index.html for the secret base path and all sub-routes
    # __APP_BASE__ is replaced with e.g. /38f7709f46db at build time
    location __APP_BASE__/ {
        try_files $uri /index.html;
    }

    # Exact match for the base path without trailing slash → redirect to slash
    location = __APP_BASE__ {
        return 301 __APP_BASE__/;
    }

    # Everything else → 404
    location / {
        return 404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
}
