server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # Disable any automatic redirects nginx might generate
    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    # Static assets — Vite outputs to /assets/... regardless of base
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA — serve index.html for any path under the secret base.
    # Using `try_files /index.html =404` (file path, not URI) avoids an
    # internal redirect that would re-enter location matching.
    # ${APP_BASE} is substituted at container startup via envsubst.
    location ~* ^${APP_BASE}(/.*)?$ {
        # Tell browsers NEVER to cache the entry HTML — old 301s from
        # earlier broken configs would otherwise stick forever.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    # Everything else → 404 (no leak that the panel exists)
    location / {
        return 404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
}
