server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Disable absolute redirects (prevents nginx rewriting port to :80)
    absolute_redirect off;
    port_in_redirect off;

    # Static assets
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA — exact base path (without trailing slash)
    location = __APP_BASE__ {
        try_files $uri /index.html;
    }

    # SPA — base path with trailing slash and all sub-routes
    location __APP_BASE__/ {
        try_files $uri /index.html;
    }

    # Everything else → 404
    location / {
        return 404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
}
