server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    port_in_redirect off;

    # Static assets (hashed filenames, always at /assets/...)
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA — serve index.html for any path under the secret base
    # try_files with a file path + =CODE avoids an internal redirect that would
    # re-enter location matching and hit the 404 catch-all below.
    location ~* ^__APP_BASE__(/.*)?$ {
        try_files /index.html =404;
    }

    # Everything else → 404
    location / {
        return 404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
}
