server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Block root — return 404 so panel isn't discoverable by port alone
    location = / {
        return 404;
    }

    # Serve SPA only under the secret base path (injected at build time)
    location __APP_BASE__ {
        try_files $uri $uri/ __APP_BASE__/index.html;
    }

    # Static assets (js/css/fonts) — served regardless of path so sub-routes work
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else → 404
    location / {
        return 404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
}
