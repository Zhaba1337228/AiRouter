server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Block root and anything not under the secret path
    location = / {
        return 404;
    }

    # Static assets — served directly
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA — serve index.html for all routes under the secret base path
    location __APP_BASE__ {
        try_files $uri /index.html;
    }

    # Everything else → 404
    location / {
        return 404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
}
