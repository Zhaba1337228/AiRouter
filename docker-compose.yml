version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: airouter_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-airouter}
      POSTGRES_USER: ${POSTGRES_USER:-airouter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No ports exposed — only reachable inside the internal network
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airouter}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: airouter_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    # No ports exposed — only reachable inside the internal network
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airouter_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-airouter}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-airouter}?sslmode=disable
      REDIS_URL: redis://redis:6379
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ADMIN_PATH: ${ADMIN_PATH:-admin}
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-https://api.ecomagent.in}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY}
      PORT: ${PORT:-8200}
    ports:
      - "${PORT:-8200}:${PORT:-8200}"
    networks:
      - internal
      - public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8200}
        VITE_ADMIN_PATH: ${ADMIN_PATH:-admin}
        VITE_APP_BASE: /${ADMIN_PATH:-admin}
    container_name: airouter_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - public
    depends_on:
      - backend

networks:
  internal:
    internal: true
  public: {}

volumes:
  postgres_data:
  redis_data:
